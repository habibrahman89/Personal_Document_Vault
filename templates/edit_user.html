<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .panel-card {
            background: #fff;
            border-radius: 18px;
            border: none;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .08);
        }

        .panel-header {
            padding: 24px 30px;
            border-bottom: 1px solid #f0f1f3;
        }

        .panel-header h3 {
            font-weight: 700;
            margin: 0;
        }

        .panel-body {
            padding: 30px;
        }

        label {
            font-weight: 500;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .self-warning {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="container mt-5">

        {% set is_self = (user.id == session.get('user_id')) %}

        <div class="card panel-card">

            <div class="panel-header">
                <h3>Edit User</h3>
            </div>

            <div class="panel-body">

                {% if is_self %}
                <div class="self-warning">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    You're editing your own account. Changing your role away from Admin or turning off
                    "Account Active" will remove your own access to the admin panel.
                </div>
                {% endif %}

                <form method="POST" id="editUserForm" onsubmit="return confirmSelfEdit(this)">

                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required
                            value="{{ user.username }}">
                    </div>

                    <div class="mb-3">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required
                            value="{{ user.email }}">
                    </div>

                    <div class="mb-3">
                        <label for="mobile">Mobile</label>
                        <input type="tel" id="mobile" name="mobile" class="form-control" value="{{ user.mobile }}">
                    </div>

                    <div class="mb-3">
                        <label for="role">Role</label>
                        <select id="role" name="role" class="form-select">

                            <option value="admin" {% if user.role=="admin" %} selected {% endif %}>
                                Admin
                            </option>

                            <option value="user" {% if user.role=="user" %} selected {% endif %}>
                                User
                            </option>

                        </select>
                    </div>

                    <div class="form-check mb-4">

                        <input type="checkbox" id="active" name="active" class="form-check-input"
                            {% if user.is_active %} checked {% endif %}>

                        <label class="form-check-label" for="active">
                            Account Active
                        </label>

                    </div>

                    <button class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-check-lg"></i>
                        Save Changes
                    </button>

                    <a href="/admin/users" class="btn btn-outline-secondary rounded-pill px-4">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

    <script>

        function confirmSelfEdit(form) {

            const isSelf = {{ 'true' if is_self else 'false' }};

            if (!isSelf) {
                return true;
            }

            const newRole = form.role.value;
            const stillActive = form.active.checked;

            if (newRole !== "admin" || !stillActive) {
                return confirm(
                    "You are editing your own account.\n\n" +
                    "Changing your role away from Admin or deactivating your account " +
                    "may immediately lock you out of the admin panel.\n\n" +
                    "Continue anyway?"
                );
            }

            return true;
        }

    </script>

</body>

</html>
