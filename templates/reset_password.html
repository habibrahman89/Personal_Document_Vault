<!DOCTYPE html>
<html>

<head>

    <title>Reset Password - Personal DigiLocker</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .reset-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        .reset-header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            text-align: center;
            padding: 28px 20px;
        }

        .reset-header h2 {
            font-weight: 700;
            margin: 0;
        }

        label {
            font-weight: 500;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            border-radius: 30px;
            padding: 10px 0;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .card-footer {
            background: #fff;
            border-top: 1px solid #f0f1f3;
        }

        .card-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-5">

                <div class="card reset-card">

                    <div class="reset-header">
                        <h2>Reset Password</h2>
                        <small>Create a new password</small>
                    </div>

                    <div class="card-body p-4">

                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'message' else 'danger' }}">
                            {{ message }}
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <form method="POST" id="resetForm" onsubmit="return validateResetForm(this)">

                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <div class="mb-3">
                                <label for="otp" class="form-label">OTP</label>
                                <input type="text" id="otp" name="otp" class="form-control"
                                    placeholder="Enter OTP received in email" inputmode="numeric"
                                    pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">New Password</label>
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="Enter new password" autocomplete="new-password"
                                    minlength="8" required>
                                <div class="form-text">At least 8 characters.</div>
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" id="confirm_password" name="confirm_password"
                                    class="form-control" placeholder="Confirm password"
                                    autocomplete="new-password" minlength="8" required>
                                <div id="matchError" class="field-error">
                                    Passwords do not match.
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Reset Password
                                </button>
                            </div>

                        </form>

                    </div>

                    <div class="card-footer text-center py-3">
                        <a href="/">
                            <i class="bi bi-arrow-left"></i>
                            Back to Login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        function validateResetForm(form) {

            const password = form.password.value;
            const confirmPassword = form.confirm_password.value;
            const errorEl = document.getElementById("matchError");

            if (password !== confirmPassword) {
                errorEl.style.display = "block";
                form.confirm_password.focus();
                return false;
            }

            errorEl.style.display = "none";
            return true;
        }

    </script>

</body>

</html>
