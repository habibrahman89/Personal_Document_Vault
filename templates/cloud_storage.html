<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cloud Storage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 4px;
        }

        .page-header p {
            color: #6b7280;
            margin: 0;
        }

        .panel-card {
            background: #fff;
            border-radius: 18px;
            border: none;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .08);
        }

        .panel-card .card-body {
            padding: 30px;
        }

        .drive-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-connected {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-disconnected {
            background: #fee2e2;
            color: #dc2626;
        }

        .coming-soon-note {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 8px;
        }
    </style>

</head>

<body>

    <div class="container mt-5">

        <div class="page-header">

            <div>
                <h1>
                    <i class="bi bi-cloud"></i>
                    Cloud Storage
                </h1>
                <p>Manage your Google Drive connection</p>
            </div>

            <a href="/dashboard" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>

        </div>

        <div class="card panel-card">

            <div class="card-body">

                <h4>
                    <i class="bi bi-google"></i>
                    Google Drive
                </h4>

                <p class="mt-3 mb-2">Status:</p>

                {% if google_connected %}

                <span class="badge bg-success">
                    Connected
                </span>

                <p>{{ user.google_email }}</p>

                <a href="/google/disconnect" class="btn btn-outline-danger">

                    Disconnect

                </a>

                {% else %}

                <span class="badge bg-secondary">
                    Not Connected
                </span>

                <a href="/google/login" class="btn btn-primary">

                    Connect Google Drive

                </a>

                {% endif %}

            </div>

        </div>

        <div class="mb-5"></div>

    </div>

</body>

</html>
