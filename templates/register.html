<!DOCTYPE html>
<html>

<head>

    <title>Register - Personal DigiLocker</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .register-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        .register-header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            text-align: center;
            padding: 28px 20px;
        }

        .register-header h3 {
            font-weight: 700;
            margin: 0;
        }

        label {
            font-weight: 500;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .username-feedback {
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 18px;
        }

        .username-feedback.checking {
            color: #6b7280;
        }

        .username-feedback.available {
            color: #16a34a;
        }

        .username-feedback.taken {
            color: #dc2626;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            border-radius: 30px;
            padding: 10px 0;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .card-footer {
            background: #fff;
            border-top: 1px solid #f0f1f3;
        }

        .card-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-5">

                <div class="card register-card">

                    <div class="register-header">
                        <h3>Create Account</h3>
                    </div>

                    <div class="card-body p-4">

                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'message' else 'danger' }}">
                            {{ message }}
                        </div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <form method="POST" action="/register" id="registerForm"
                            onsubmit="return validateRegisterForm(this)">

                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control"
                                    autocomplete="username" minlength="3" required>
                                <div id="usernameFeedback" class="username-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control"
                                    autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="full_name" class="form-label">Full Name</label>
                                <input type="text" id="full_name" name="full_name" class="form-control"
                                    autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label for="mobile" class="form-label">Mobile Number</label>
                                <input type="tel" id="mobile" name="mobile" class="form-control"
                                    autocomplete="tel" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control"
                                    autocomplete="new-password" minlength="8" required>
                                <div class="form-text">At least 8 characters.</div>
                            </div>

                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" id="confirm_password" name="confirm_password"
                                    class="form-control" autocomplete="new-password" minlength="8" required>
                                <div id="matchError" class="field-error">
                                    Passwords do not match.
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">
                                    Create Account
                                </button>
                            </div>

                        </form>

                    </div>

                    <div class="card-footer text-center py-3">
                        Already have an account?
                        <a href="/">Login</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // ---- Real-time username availability check ----

        const usernameInput = document.getElementById("username");
        const usernameFeedback = document.getElementById("usernameFeedback");

        let usernameStatus = null;   // null = not checked yet, true = available, false = taken/invalid
        let debounceTimer = null;
        let requestCounter = 0;      // guards against a slow older response overwriting a newer one

        function setUsernameFeedback(state, message) {
            usernameFeedback.className = "username-feedback " + state;

            if (state === "checking") {
                usernameFeedback.innerHTML =
                    '<span class="spinner-border spinner-border-sm" role="status"></span> ' + message;
            } else if (state === "available") {
                usernameFeedback.innerHTML = '<i class="bi bi-check-circle-fill"></i> ' + message;
            } else if (state === "taken") {
                usernameFeedback.innerHTML = '<i class="bi bi-x-circle-fill"></i> ' + message;
            } else {
                usernameFeedback.innerHTML = "";
            }
        }

        function checkUsernameAvailability(username) {

            const thisRequest = ++requestCounter;

            fetch("/api/check-username?username=" + encodeURIComponent(username))
                .then(response => response.json())
                .then(data => {

                    // Ignore this response if a newer keystroke has already fired a new request
                    if (thisRequest !== requestCounter) {
                        return;
                    }

                    usernameStatus = data.available;

                    if (data.available) {
                        setUsernameFeedback("available", data.message);
                        usernameInput.classList.remove("is-invalid");
                        usernameInput.classList.add("is-valid");
                    } else {
                        setUsernameFeedback("taken", data.message);
                        usernameInput.classList.remove("is-valid");
                        usernameInput.classList.add("is-invalid");
                    }
                })
                .catch(() => {
                    if (thisRequest !== requestCounter) {
                        return;
                    }
                    usernameStatus = null;
                    setUsernameFeedback("", "");
                    usernameInput.classList.remove("is-valid", "is-invalid");
                });
        }

        usernameInput.addEventListener("input", function () {

            const value = usernameInput.value.trim();

            usernameInput.classList.remove("is-valid", "is-invalid");
            clearTimeout(debounceTimer);

            if (value.length < 3) {
                usernameStatus = null;
                setUsernameFeedback("", "");
                return;
            }

            usernameStatus = null;
            setUsernameFeedback("checking", "Checking availability...");

            debounceTimer = setTimeout(() => checkUsernameAvailability(value), 400);
        });

        // ---- Password match + final submit guard ----

        function validateRegisterForm(form) {

            const password = form.password.value;
            const confirmPassword = form.confirm_password.value;
            const errorEl = document.getElementById("matchError");

            if (usernameStatus === false) {
                setUsernameFeedback("taken", "Please choose a different username before continuing.");
                usernameInput.focus();
                return false;
            }

            if (usernameStatus === null && usernameInput.value.trim().length >= 3) {
                // A check is still in flight (or never resolved) — don't let a stale/unknown
                // state slip through, but don't block short-circuit typos either.
                setUsernameFeedback("checking", "Still checking availability, please wait...");
                usernameInput.focus();
                return false;
            }

            if (password !== confirmPassword) {
                errorEl.style.display = "block";
                form.confirm_password.focus();
                return false;
            }

            errorEl.style.display = "none";
            return true;
        }

    </script>

</body>

</html>
